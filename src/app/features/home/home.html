<app-balance [transactions]="transactions()"></app-balance>

<div class="actions">
  <a matButton="filled" routerLink="create">Adicionar Transação</a>
</div>

<div class="transactions">
  @for (transaction of transactions(); track transaction) {
    <app-transaction-item
      class="transactions"
      [transaction]="transaction"
      (editTransaction)="editTransaction($event)"
      (removeTransaction)="removeTransaction($event)"
     ></app-transaction-item>
  } @empty {
    <app-no-transactions/>
  }
</div>
