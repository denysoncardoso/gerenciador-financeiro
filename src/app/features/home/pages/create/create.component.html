<form [formGroup]="form">

  <mat-form-field>
    <mat-label>Enter your email</mat-label>
    <input
      matInput
      placeholder="Digite o título da transação"
      [formControlName]="'title'"
      required
    />
      @if (form.controls.title.invalid) {
        <mat-error>Campo Obrigatório</mat-error>
      }
  </mat-form-field>

</form>
