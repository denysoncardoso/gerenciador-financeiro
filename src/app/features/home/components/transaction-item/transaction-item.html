<mat-card class="card">
  <div>
    <div class="card-title">
      {{ transaction().title }}
    </div>

    <div class="card-values">
      <app-transaction-values [transaction]="transaction()"/>
    </div>

  </div>

  <div class="card-actions">
    <button mat-button (click)="editTransaction.emit(transaction())">Editar</button>
    <button mat-button (click)="removeTransaction.emit(transaction())">Excluir</button>
  </div>
</mat-card>
